<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 888" role="img" aria-labelledby="r3-title r3-desc"><title id="r3-title">Corrected R3 scope in column 9</title><desc id="r3-desc">Event order in column 9: e70 leans right; e88, e107, e126, e145 and e164 lean left; e187 leans right. R3 requires contact for the four consecutive left-lean pairs. It imposes no contact equality between e70 and e187 because five opposite-lean events intervene. This is an event-order diagram, not a geometric scale drawing.</desc><style>.label{font:14px 'Courier New',monospace;fill:#263b36}.small{font:12px 'Courier New',monospace;fill:#5e6a63}.big{font:700 24px Georgia,serif;fill:#b33f25}.red{font:14px 'Courier New',monospace;fill:#b33f25}.heading{font:700 17px Georgia,serif;fill:#263b36}</style>
