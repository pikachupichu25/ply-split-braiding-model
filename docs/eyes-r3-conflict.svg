ite lean: no contact rule</text><rect x="245" y="583" width="245" height="54" rx="2" fill="#e8ba9d" stroke="#274d48"/><text x="267" y="616" class="label" >e187</text><text x="348" y="616" class="small" >9 → 10 · right</text>
