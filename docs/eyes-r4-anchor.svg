<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 558" role="img" aria-labelledby="r4-title r4-desc"><title id="r4-title">The held R4 departure is not centred</title><desc id="r4-desc">Schematic comparison for events 82 and 88, C02's departure. Actual placement aligns their top corners at zero offset; the R4 target aligns the later top corner to the earlier edge midpoint, half a cell side lower. Dot in rust marks the earlier cell midpoint, dark dot the later cell top corner. The target panel isolates this one request, not a solution for all constraints.</desc><style>.label{font:14px 'Courier New',monospace;fill:#263b36}.small{font:12px 'Courier New',monospace;fill:#5e6a63}.big{font:700 24px Georgia,serif;fill:#b33f25}.red{font:14px 'Courier New',monospace;fill:#b33f25}.heading{font:700 17px Georgia,serif;fill:#263b36}</style><text x="225" y="38" class="small" text-anchor="middle">CURRENT · MARKED “HELD”</text><text x="655" y="38" class="small" text-anchor="middle">R4 MIDPOINT TARGET</text><line x1="440" y1="55" x2="440" y2="427" stroke="#ccd2c5" stroke-width="1.5" /><polygon points="225,135 225,275 330,170 330,30" fill="#bed9d2" stroke="#274d48" stroke-width="1.5" /><polygon points="225,135 225,275 120,170 120,30" fill="#e8ba9d" stroke="#274d48" stroke-width="1.5" /><line x1="225" y1="100" x2="225" y2="375" stroke="#738b7b" stroke-width="1.5" stroke-dasharray="3 5"/><circle cx="225" cy="205" r="5" fill="#b33f25"/><circle cx="225" cy="135" r="5" fill="#263b36"/><text x="280" y="159" class="label" text-anchor="middle">e82</text><text x="170" y="159" class="label" text-anchor="middle">e88</text><text x="225" y="410" class="heading" text-anchor="middle">Actual offset: 0</text><polygon points="655,135 655,275 760,170 760,30" fill="#bed9d2" stroke="#274d48" stroke-width="1.5" /><polygon points="655,205 655,345 550,240 550,100" fill="#e8ba9d" stroke="#274d48" stroke-width="1.5" /><line x1="655" y1="100" x2="655" y2="375" stroke="#738b7b" stroke-width="1.5" stroke-dasharray="3 5"/><circle cx="655" cy="205" r="5" fill="#b33f25"/><circle cx="655" cy="205" r="5" fill="#263b36"/><text x="710" y="159" class="label" text-anchor="middle">e82</text><text x="600" y="229" class="label" text-anchor="middle">e88</text><text x="655" y="410" class="heading" text-anchor="middle">Required offset: S/2</text><text x="300" y="210" class="red" >midpoint</text><text x="730" y="210" class="red" >contact</text><text x="440" y="450" class="small" text-anchor="middle">Rust dot = earlier midpoint · Dark dot = later top corner</text><g aria-label="Event details"><line x1="25" y1="473" x2="855" y2="473" stroke="#ccd2c5"/><text x="30" y="498" class="small">EVENT · SPLITTER → SPLITTEE · COLUMN</text><text x="30" y="526" class="label">e82 · C19 → C02 · col 10</text><text x="470" y="526" class="label">e88 · C02 → C18 · col 9</text></g></svg>